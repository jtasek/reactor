# The editor with accounts, and the PostgreSQL database that keeps them.
# Set POSTGRES_PASSWORD, BETTER_AUTH_SECRET (at least 32 random characters) and
# SMTP_URL, for example in a .env file next to this one, then run
# `docker compose up --build`.
services:
    app:
        build: .
        ports:
            - '4000:4000'
        environment:
            DATABASE_URL: postgres://reactor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/reactor
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
            SMTP_URL: ${SMTP_URL:?Set SMTP_URL}
            MAIL_FROM: ${MAIL_FROM:-}
            TRUST_PROXY: ${TRUST_PROXY:-false}
        read_only: true
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: reactor
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
            POSTGRES_DB: reactor
        volumes:
            - db:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U reactor -d reactor']
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

volumes:
    db:
