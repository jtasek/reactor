name: Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, so the lint gate can compare a pull request with its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned by `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Lint gate, app, test and server type-checks, unit tests, then browser tests
      # against a production build. On pull requests, every file the pull
      # request changes must be lint-clean.
      - run: pnpm check
        env:
          LINT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  # The container as deployed: built from the Dockerfile, with a read-only file
  # system, smoke-tested, then stopped as an orchestrator would.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: docker build -t reactor .

      - run: docker run -d --name reactor --read-only -p 127.0.0.1:4000:4000 reactor

      - run: timeout 60 sh -c 'until curl -sf -o /dev/null http://127.0.0.1:4000/healthz; do sleep 1; done'

      - run: node scripts/smoke.mjs http://127.0.0.1:4000

      - run: |
          docker stop --time 15 reactor
          test "$(docker inspect --format '{{.State.ExitCode}}' reactor)" = 0

      - if: failure()
        run: docker logs reactor
